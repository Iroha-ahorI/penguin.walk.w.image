<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>ペンギンウォーク</title>

<style>
  body {
    margin: 0;
    padding: 0;
    background: #eef7ff;
    font-family: system-ui;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* 上：プレイマットコンテナ（ここに play-area を後から合わせる） */
  #play-container {
    flex: 1;
    position: relative;
    overflow: hidden;
    display: flex;
    justify-content: center;
  }

  /* 実際の画像要素（画面の短辺にフィットさせる） */
    #play-img {
    width: auto;
    height: auto;
    max-width: 100vw;        /* 縦画面では横にフィット */
    max-height: calc(100vh - 20vh); /* 横画面では縦にフィット（手札分を除く） */
    object-fit: contain;
    display: block;
    }


  /* 画像の実際の表示領域＝play-area（JSでサイズ・位置を決める） */
  #play-area {
    position: absolute;
    pointer-events: none;
  }

  /* 画像の上に重ねるオーバーレイレイヤー */
  #img-overlay {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .anchor {
    position: absolute;
    width: 14px;
    height: 14px;
    background: transparent;
    border-radius: 50%;
    pointer-events: none;
    z-index: 999;
  }


  /* カードスロット（位置は JS で決める） */
  .card-slot {
    position: absolute;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .card-img {
    width: 80%;
    height: auto;
    object-fit: contain;
  }

  /* 下：手札エリア */
  #hand-area {
    height: 20vh;
    background: #ffffff;
    border-top: 2px solid #ccc;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 1vh;
    padding: 1vh;
    overflow-x: auto;
  }

  .hand-card{
      height:14vh;
      width:calc(14vh * 81 / 124);
  }

  .hand-card img{
      width:100%;
      height:100%;
  }

    #draw-button {
    width: calc(14vh * 81 / 124);
    height: 14vh;

    margin-left: 2vw; /* 画面横幅の2%だけ離す */

    border: 2px solid #666;
    border-radius: 8px;

    background: rgba(48, 109, 241, 0.836);

    font-size: 2vh;
    cursor: pointer;

    flex-shrink: 0;
  }

  #penguin{
    position:absolute;
    width:40px;
    height:auto;
    display:none;
    pointer-events:none;
    z-index:1000;
  }

  #q-card-panel{
    position:absolute;

    right:2vw;
    bottom:22vh;

    background:white;
    border:2px solid #666;
    border-radius:10px;

    padding:10px;

    display:none;

    z-index:2000;
  }

  #q-card-buttons{
    display:grid;

    grid-template-columns:repeat(5,1fr);
    gap:5px;
  }

  .q-number-button{
    width:50px;
    height:50px;

    font-size:20px;
  }

  #game-message{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    background:white;
    border:4px solid #333;
    border-radius:15px;

    padding:30px;

    font-size:48px;
    font-weight:bold;

    z-index:5000;

    display:none;
  }

  #restart-button{
    position:absolute;

    right:20px;
    top:20px;

    width:140px;
    height:50px;

    font-size:20px;

    z-index:5000;
  }

  @media screen and (orientation: portrait) {
  body {
    transform: rotate(90deg);
    transform-origin: left top;
    width: 100vh;
    height: 100vw;
    overflow: hidden;
  }


}




</style>
</head>

<body>

<!-- ▼ プレイマットコンテナ -->
<div id="play-container">
  <!-- 実際の画像 -->
  <img id="play-img" src="list_無題14.png">

  <!-- 画像の実際の表示領域＝play-area -->
  <div id="play-area">
    <!-- 画像に従属するオーバーレイ -->
    <div id="img-overlay">
      <!-- 左上1：伏せた山札 -->
      <div id="deck-back" class="card-slot">
        <img src="card_back.png" class="card-img">
      </div>

      <!-- 左上2：めくったカード -->
      <div id="deck-front" class="card-slot"></div>
    </div>
    <div id="anchors"></div>
    <img id="penguin" src="peng.png">
  </div>



</div>

<!-- ▼ 手札 -->
<div id="hand-area">

  <div class="hand-card">
    <img src="card_p.png" class="hand-card-img">
  </div>

  <div class="hand-card">
    <img src="card_m.png" class="hand-card-img">
  </div>

  <div class="hand-card">
    <img src="card_t.png" class="hand-card-img">
  </div>

  <div class="hand-card">
    <img src="card_d.png" class="hand-card-img">
  </div>

  <button id="draw-button"></button>

</div>

<div id="q-card-panel">
  <div>好きな数字を選択</div>

  <div id="q-card-buttons">
  </div>
</div>

<script>
/* ▼ 画像の実際の表示領域を play-area に反映する */
function updatePlayArea() {
  const img = document.getElementById("play-img");
  const container = document.getElementById("play-container");
  const playArea = document.getElementById("play-area");

  const imgRect = img.getBoundingClientRect();
  const containerRect = container.getBoundingClientRect();

  // play-area を「画像の実際の表示領域」と一致させる
  const left = imgRect.left - containerRect.left;
  const top  = imgRect.top  - containerRect.top;
  const width  = imgRect.width;
  const height = imgRect.height;

  playArea.style.left   = left + "px";
  playArea.style.top    = top + "px";
  playArea.style.width  = width + "px";
  playArea.style.height = height + "px";
}

/* ▼ 画像の実際の表示領域（play-area）を 8 分割する関数（縦2 × 横4） */
function getGridPosition(col, row) {
  const playArea = document.getElementById("play-area");
  const areaRect = playArea.getBoundingClientRect();

  const cellW = areaRect.width / 4;  // 横4分割
  const cellH = areaRect.height / 2; // 縦2分割

  return {
    left: cellW * col,
    top:  cellH * row,
    width: cellW,
    height: cellH
  };
}

/* ▼ カードを配置する */
function placeCards() {
  updatePlayArea(); // まず play-area を画像に合わせる

  const back = document.getElementById("deck-back");
  const front = document.getElementById("deck-front");

  // 左上1（col=0, row=0）
  const posBack = getGridPosition(0, 0);
  back.style.left   = posBack.left + "px";
  back.style.top    = posBack.top + "px";
  back.style.width  = posBack.width + "px";
  back.style.height = posBack.height + "px";

  // 左上2（col=1, row=0）
  const posFront = getGridPosition(1, 0);
  front.style.left   = posFront.left + "px";
  front.style.top    = posFront.top + "px";
  front.style.width  = posFront.width + "px";
  front.style.height = posFront.height + "px";
}

/* ▼ 画像読み込み後に配置、リサイズ時も再配置 */
window.addEventListener("load", placeCards);
window.addEventListener("resize", placeCards);

function checkOrientation() {
  if (window.innerHeight > window.innerWidth) {
    alert("横画面で遊んでください！↶");
  }
}

window.addEventListener("load", checkOrientation);
window.addEventListener("resize", checkOrientation);

const ORIG_W = 480;
const ORIG_H = 339;

const anchorPoints = [
  {x: 50,  y:268}, // 1
  {x: 68,  y:311}, // 2
  {x: 96,  y:269}, // 3
  {x:125,  y:306}, // 4
  {x:151,  y:264}, // 5
  {x:119,  y:232}, // 6
  {x: 82,  y:217}, // 7
  {x:146,  y:206}, // 8
  {x:206,  y:186}, // 9
  {x:204,  y:255}, // 10
  {x:191,  y:303}, // 11
  {x:261,  y:275}, // 12
  {x:250,  y:196}, // 13
  {x:295,  y:219}, // 14
  {x:333,  y:182}, // 15
  {x:371,  y:224}, // 16
  {x:330,  y:280}, // 17
  {x:386,  y:312}, // 18
  {x:432,  y:260}, // 19
  {x:431,  y:178}, // 20
];

function placeAnchors() {
  updatePlayArea(); // 画像の実際の表示領域を更新

  const img = document.getElementById("play-img");
  const imgRect = img.getBoundingClientRect();

  const playArea = document.getElementById("play-area");
  const areaRect = playArea.getBoundingClientRect();

  const anchors = document.getElementById("anchors");
  anchors.innerHTML = "";

  anchorPoints.forEach((p, i) => {
    const anchor = document.createElement("div");
    anchor.className = "anchor";

    // 元画像 → 実際の表示サイズへの変換
    const dispX = (p.x / ORIG_W) * imgRect.width;
    const dispY = (p.y / ORIG_H) * imgRect.height;

    // play-area 基準に変換
    anchor.style.left = (dispX - 7) + "px"; // 10px はアンカー半径
    anchor.style.top  = (dispY - 7) + "px";

    anchor.dataset.index = i + 1;

    anchors.appendChild(anchor);
  });
}


  window.addEventListener("load", () => {
    placeCards();
    placeAnchors();
  });

  window.addEventListener("resize", () => {
    placeCards();
    placeAnchors();
  });

  let hand = [];

  function createHand() {
    const handDeck = [];

    // p 10枚
    for(let i = 0; i < 10; i++){
      handDeck.push("p");
    }

    // m 10枚
    for(let i = 0; i < 10; i++){
      handDeck.push("m");
    }

    // t 7枚
    for(let i = 0; i < 7; i++){
      handDeck.push("t");
    }

    // d 7枚
    for(let i = 0; i < 7; i++){
      handDeck.push("d");
    }

    // シャッフル
    handDeck.sort(() => Math.random() - 0.5);

    // 先頭6枚を手札にする
    hand = handDeck.slice(0, 6);
  }

  function renderHand() {
  const handArea = document.getElementById("hand-area");
  
  handArea.innerHTML = "";
  
  hand.forEach((card,index) =>  {
  const div = document.createElement("div");
  div.className = "hand-card";
  
  div.innerHTML =
  `<img src="card_${card}.png" class="hand-card-img">`;
  div.onclick = () => useCard(index);

  handArea.appendChild(div);
  });
  
  const drawBtn = document.createElement("button");
  drawBtn.id = "draw-button";
  drawBtn.innerHTML = "山札を<br>めくる";
  
  handArea.appendChild(drawBtn);
  drawBtn.onclick = drawCard;

  }

  let deck = [];

  function createDeck() {
    deck = [];

    // 1～4は4枚ずつ
    for(let n = 1; n <= 4; n++) {
      for(let i = 0; i < 4; i++) {
        deck.push(n);
      }
    }

    // 5～9は3枚ずつ
    for(let n = 5; n <= 9; n++) {
      for(let i = 0; i < 3; i++) {
        deck.push(n);
      }
    }

    // ?カード3枚
    for(let i = 0; i < 3; i++) {
      deck.push("q");
    }

    // シャッフル
    deck.sort(() => Math.random() - 0.5);
  }

  let currentCard = null;
  let penguinPos = null;
  let gameOver = false;

  function useCard(index){

    if(gameOver){
      return;
    }

    if(currentCard === null){
      alert("先に山札をめくってください");
      return;
    }

    const operation = hand[index];

    let newPos = penguinPos;

    switch(operation){

      case "p":
        newPos += Number(currentCard);
        break;

      case "m":
        newPos -= Number(currentCard);
        break;

      case "t":
        newPos *= Number(currentCard);
        break;

      case "d":
        newPos = Math.round(
          newPos / Number(currentCard)
        );
        break;
    }

    if(newPos < 1 || newPos > 20){
         endGame("バッドペンギンウォーク");
        return;
    }
    movePenguin(newPos);

    hand.splice(index,1);

    currentCard = null;

    /* 手札を全て使い切った */
    if(hand.length === 0){

        endGame("グッドペンギンウォーク");

        return;
    }

    renderHand();
  }

  function movePenguin(position){

    const p = anchorPoints[position - 1];

    const img = document.getElementById("play-img");
    const imgRect = img.getBoundingClientRect();

    const dispX = (p.x / ORIG_W) * imgRect.width;
    const dispY = (p.y / ORIG_H) * imgRect.height;

    const penguin = document.getElementById("penguin");

    penguin.style.left = (dispX - 20) + "px";
    penguin.style.top  = (dispY - 20) + "px";

    penguin.style.display = "block";

    penguinPos = position;
  }

  function endGame(message){

    gameOver = true;

    const msg =
      document.getElementById("game-message");

    msg.textContent = message;
    msg.style.display = "block";
  }

  function applyDrawnCard(card){

    const front =
      document.getElementById("deck-front");

    // 表向きカード表示
    front.innerHTML =
      `<img src="card_${card}.png" class="card-img">`;

    currentCard = card;

    // 初回ドローは開始位置決定
    if(penguinPos === null){

      movePenguin(card);

      // 初回カードは位置決定専用
      currentCard = null;
    }
  }

  function drawCard() {

    const front = document.getElementById("deck-front");
    const back = document.getElementById("deck-back");

    if(gameOver){
      return;
    }

    if(deck.length === 0){
      alert("山札がありません");
      return;
    }

    let card = deck.pop();

    if(card === "q"){

      waitingQ = true;

      document.getElementById(
        "q-card-panel"
      ).style.display = "block";

      return;
    }

    applyDrawnCard(card);
  }

  
  function createQPanel(){

    const area =
      document.getElementById("q-card-buttons");

    area.innerHTML = "";

    for(let i=1;i<=10;i++){

      const btn =
        document.createElement("button");

      btn.className =
        "q-number-button";

      btn.textContent = i;

      btn.onclick = () =>{
        selectQNumber(i);
      };

      area.appendChild(btn);
    }
  }

  let waitingQ = false;

  function selectQNumber(num){

    applyDrawnCard(num);

    document.getElementById("q-card-panel")
      .style.display = "none";

    waitingQ = false;
  }

  function restartGame(){

    // 状態初期化
    gameOver = false;
    currentCard = null;
    penguinPos = null;
    waitingQ = false;

    // ゲームメッセージ消去
    document.getElementById("game-message")
      .style.display = "none";

    // ペンギン非表示
    document.getElementById("penguin")
      .style.display = "none";

    // 表向きカード消去
    document.getElementById("deck-front")
      .innerHTML = "";

    // 山札裏面復活
    document.getElementById("deck-back")
      .innerHTML =
      '<img src="card_back.png" class="card-img">';

    // qパネルを閉じる
    document.getElementById("q-card-panel")
      .style.display = "none";

    // 山札・手札再生成
    createDeck();
    createHand();

    // 描画更新
    renderHand();
  }


  window.addEventListener("load", () => {
    createDeck();
    createHand();

    createQPanel();    

    placeCards();
    placeAnchors();

    renderHand();

      document
    .getElementById("restart-button")
    .onclick = restartGame;
  });

</script>

<div id="game-message"></div>
<button id="restart-button">
  リスタート
</button>

</body>
</html>
